<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestor de tareas</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="app__header">
      <h1>Gestor de tareas</h1>
      <p class="app__subtitle">Organiza lo que tienes que hacer</p>
    </header>

    <form class="task-form">
      <label for="task-input" class="task-form__label">Nueva tarea</label>
      <div class="task-form__row">
        <input
          type="text"
          id="task-input"
          name="task"
          class="task-form__input"
          placeholder="Ej.: Comprar pan"
          autocomplete="off"
          required
        >
        <button type="submit" class="btn btn--primary">Añadir</button>
      </div>
    </form>

    <section aria-labelledby="list-title">
      <h2 id="list-title" class="visually-hidden">Lista de tareas</h2>
      <ul class="task-list">
        <li class="task">
          <span class="task__text">Repasar los apuntes de JavaScript</span>
        </li>
        <li class="task">
          <span class="task__text">Comprar fruta para la semana</span>
        </li>
        <li class="task">
          <span class="task__text">Llamar al dentista para pedir cita</span>
        </li>
      </ul>
    </section>
  </main>
</body>
</html>
